<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proof</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="wrap">
<h1>Proof</h1>
<p>Every payout is on-chain. Nothing here is editable by hand.</p>
<div class="row"><span>Total paid out</span><b id="tp">—</b></div>
<div class="row"><span>Users paid</span><b id="up">—</b></div>
<h2>Last 20 txids</h2>
<table id="tbl"></table>
<a class="btn alt" href="/">Back</a>
</div>
<script type="module">
import { sb, fmt } from './config.js';
const { data } = await sb.rpc('public_stats');
const s = (data || [])[0] || {};
document.getElementById('tp').textContent = fmt(s.total_paid || 0);
document.getElementById('up').textContent = s.users_paid || 0;
document.getElementById('tbl').innerHTML = (s.recent || []).map(r =>
  `<tr><td>${fmt(r.amount)}</td><td><a target="_blank" style="color:#16a34a" href="https://bscscan.com/tx/${r.txid}">${r.txid.slice(0,14)}…</a></td></tr>`
).join('') || '<tr><td>No payouts yet.</td></tr>';
</script></body></html>
